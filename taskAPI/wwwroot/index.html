<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Showcase</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Deterministic Movie Generator</p>
                <h1>Movie Showcase</h1>
            </div>

            <div class="view-switcher" role="group">
                <button type="button"
                        class="view-button active"
                        data-view="table">
                    Table
                </button>

                <button type="button"
                        class="view-button"
                        data-view="gallery">
                    Gallery
                </button>
            </div>
        </header>

        <section class="controls-panel">
            <label class="control">
                <span>Region</span>
                <select id="locale"></select>
            </label>

            <div class="control">
                <span>Dataset</span>

                <div class="dataset-actions">
                    <button id="random-seed"
                            class="randomize-button"
                            type="button">
                        ↻ Generate new movies
                    </button>

                    <button id="advanced-toggle"
                            class="advanced-button"
                            type="button"
                            aria-expanded="false">
                        Advanced
                    </button>
                </div>

                <div id="advanced-panel"
                     class="advanced-panel hidden">
                    <label for="seed">Seed</label>

                    <div class="advanced-seed-row">
                        <input id="seed"
                               type="text"
                               inputmode="numeric"
                               autocomplete="off"
                               spellcheck="false">

                        <button id="apply-seed"
                                type="button">
                            Apply
                        </button>
                    </div>

                    <small>
                        Same seed generates the same movie dataset.
                    </small>
                </div>
            </div>

            <label class="control">
                <span>
                    Likes
                    <output id="likes-value"></output>
                </span>

                <input id="likes"
                       type="range"
                       step="0.1">
            </label>

            <label class="control">
                <span>
                    Reviews
                    <output id="reviews-value"></output>
                </span>

                <input id="reviews"
                       type="range"
                       step="0.1">
            </label>
        </section>

        <main>
            <section id="table-view" class="view-container">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Year</th>
                                <th>Genre</th>
                                <th>Actors</th>
                                <th>Likes</th>
                                <th>Reviews</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="movie-table-body"></tbody>
                    </table>
                </div>

                <nav class="pagination">
                    <button id="previous-page" type="button">
                        Previous
                    </button>

                    <span id="page-indicator"></span>

                    <button id="next-page" type="button">
                        Next
                    </button>
                </nav>
            </section>

            <section id="gallery-view"
                     class="view-container hidden">
                <div id="movie-gallery" class="movie-gallery"></div>
                <div id="gallery-sentinel" class="gallery-sentinel"></div>
            </section>

            <div id="loading" class="loading hidden">
                <div class="loader"></div>
            </div>

            <div id="error" class="error-message hidden"></div>
        </main>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
